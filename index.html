<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 文字冒险引擎 Ultra Pro (多模型联动版)</title>
    <style>
        :root { --bg-color: #0d0e12; --panel-bg: #16171d; --accent-color: #00ffcc; --accent-glow: rgba(0, 255, 204, 0.3); --text-color: #e2e8f0; --text-muted: #64748b; --user-color: #ff007f; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 95vh; margin: 0; }
        #setup-container, #game-container { width: 100%; max-width: 750px; background: var(--panel-bg); padding: 35px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); box-sizing: border-box; }
        h2 { margin-top: 0; color: #fff; text-align: center; font-size: 26px; font-weight: 700; }
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; color: var(--accent-color); font-weight: 600; font-size: 14px; }
        input[type="text"], textarea, select { width: 100%; background: #20222b; border: 1px solid #2d313f; color: #fff; padding: 14px; border-radius: 8px; box-sizing: border-box; outline: none; }
        textarea { height: 90px; resize: none; }
        .start-btn { width: 100%; background: var(--accent-color); color: #000; border: none; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 8px; margin-top: 15px; }
        #game-container { display: none; padding-top: 25px; position: relative; }
        
        .status-bar { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr 1fr; background: #1f212a; padding: 12px 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #2d313f; font-size: 12px; align-items: center; gap: 8px; }
        .status-item { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .status-label { color: var(--text-muted); font-size: 11px; font-weight: bold; }
        .status-value { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icon-btn { background: #252834; border: 1px solid #2d313f; color: #fff; padding: 8px 4px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.2s; text-align: center; white-space: nowrap; }
        .icon-btn:hover { border-color: var(--accent-color); }
        
        .info-modal { display: none; position: absolute; top: 105px; left: 35px; right: 35px; background: #1c1e27; border: 1px solid var(--accent-color); box-shadow: 0 15px 30px rgba(0,0,0,0.7); border-radius: 10px; padding: 20px; z-index: 100; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #2d313f; padding-bottom: 8px; }
        .modal-title { color: var(--accent-color); font-weight: bold; font-size: 15px; }
        .modal-close { color: var(--text-muted); cursor: pointer; font-size: 18px; }
        .modal-body { font-size: 14px; line-height: 1.6; color: #edf2f7; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
        
        .control-bar { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; flex-wrap: wrap; gap: 10px; }
        .btn-group { display: flex; gap: 8px; align-items: center; }
        .btn-sm { padding: 6px 14px; font-size: 12px; cursor: pointer; border: 1px solid #2d313f; background: #1f212a; color: var(--text-color); border-radius: 6px; }
        .select-sm { background: #1f212a; color: #fff; border: 1px solid #2d313f; padding: 5px 8px; border-radius: 6px; font-size: 12px; height: 28px; width: auto; outline: none; cursor: pointer; }
        .select-sm:hover { border-color: var(--accent-color); }
        
        #story-display { height: 420px; overflow-y: auto; background: #0f1015; border: 1px solid #1f212a; margin-bottom: 20px; padding: 20px; border-radius: 10px; font-size: 16px; line-height: 1.8; }
        #input-container { display: flex; background: #1f212a; border-radius: 8px; padding: 6px; border: 1px solid #2d313f; }
        #player-input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; font-size: 16px; outline: none; }
        #send-btn { background: var(--accent-color); color: #000; border: none; padding: 0 24px; font-weight: 700; cursor: pointer; border-radius: 6px; }
        .story-block { margin-bottom: 15px; border-bottom: 1px solid #1a1c23; padding-bottom: 15px; }
        .user-action { color: var(--user-color); border-left: 3px solid var(--user-color); padding-left: 12px; font-weight: 600; margin-bottom: 8px; }
        .collapsible .user-action { cursor: pointer; }
        .collapsible .user-action::after { content: ' 📄 (点击展开)'; font-size: 11px; color: var(--text-muted); }
        .ai-response { color: #edf2f7; white-space: pre-wrap; border-left: 3px solid var(--accent-color); padding-left: 12px; overflow: hidden; transition: all 0.3s; max-height: 2000px; opacity: 1; }
        .collapsible.collapsed .ai-response { max-height: 0; opacity: 0; padding: 0; margin: 0; border: none; }
        .system-msg { color: var(--text-muted); font-style: italic; font-size: 13px; text-align: center; margin: 15px 0; }
    </style>
</head>
<body>
    <div id="setup-container">
        <h2>🛠️ 创造你的游戏 world Ultra Pro</h2>
        <div class="form-group"><label>1. 你的 DeepSeek API Key</label><input type="text" id="api-key-input" placeholder="sk-..."></div>
        <div class="form-group"><label>2. 快捷读档</label><div style="display: flex; gap: 8px; margin-top: 5px;"><button class="btn-sm" onclick="quickLoad(1)">进度 1</button><button class="btn-sm" onclick="quickLoad(2)">进度 2</button><button class="btn-sm" onclick="quickLoad(3)">进度 3</button></div></div>
        <hr style="border: 0; border-top: 1px solid #2d313f; margin: 25px 0;">
        
        <!-- 已修改：value 准确对应 deepseek-v4-pro 与 deepseek-v4-flash -->
        <div class="form-group">
            <label>3. 选择初始 AI 驱动核心</label>
            <select id="model-select">
                <option value="deepseek-v4-pro">DeepSeek Pro (深度推理 / 极致丰富剧情描述)</option>
                <option value="deepseek-v4-flash">DeepSeek Flash (极速响应 / 轻量爽快战斗探索)</option>
            </select>
        </div>
        
        <div class="form-group"><label>4. 设计世界观背景</label><textarea id="world-input"></textarea></div>
        <div class="form-group"><label>5. 设定你的主角</label><textarea id="character-input"></textarea></div>
        <div class="form-group"><label>6. 设定主线大方向</label><textarea id="plot-input"></textarea></div>
        <div class="form-group">
            <label>7. 游戏人称视角叙事设定</label>
            <select id="pov-select">
                <option value="第二人称叙事（在推演剧本和环境时，必须全部使用“你”来称呼玩家，增强沉浸代入感）">第二人称（以“你”展开冒险）</option>
                <option value="第三人称叙事（在推演剧本和环境时，必须全部使用“他/她”或主角名字来描述玩家，采用宏大的上帝视角）">第三人称（以“他/她”展开故事）</option>
            </select>
        </div>
        <button class="start-btn" id="start-game-btn">生成世界，进入冒险</button>
    </div>

    <div id="game-container">
        <div class="status-bar">
            <div class="status-item"><span class="status-label">❤️ 生命值</span><span class="status-value" id="status-hp">等待生成...</span></div>
            <div class="status-item"><span class="status-label">📍 当前位置</span><span class="status-value" id="status-loc">等待生成...</span></div>
            <button class="icon-btn" id="modal-inv-btn" onclick="toggleModal('modal-inv', true)">🎒 装备</button>
            <button class="icon-btn" id="modal-rel-btn" onclick="toggleModal('modal-rel', true)">👥 关系</button>
            <button class="icon-btn" id="export-btn" style="border-color: #ffb300; color: #ffb300;">📜 导出</button>
        </div>

        <div class="info-modal" id="modal-inv">
            <div class="modal-header"><span class="modal-title">🎒 携带的装备与道具</span><span class="modal-close" onclick="toggleModal('modal-inv', false)">✕</span></div>
            <div class="modal-body" id="status-inv-box">暂无道具</div>
        </div>

        <div class="info-modal" id="modal-rel">
            <div class="modal-header"><span class="modal-title">👥 人物关系网络</span><span class="modal-close" onclick="toggleModal('modal-rel', false)">✕</span></div>
            <div class="modal-body" id="status-rel-box">还未遇到重要角色...</div>
        </div>

        <div class="info-modal" id="export-modal" style="display: none; flex-direction: column;">
            <div class="modal-header"><span class="modal-title">📜 我的冒险回忆录</span><span class="modal-close" id="close-export-btn">✕</span></div>
            <textarea id="export-textarea" style="height: 220px; margin-bottom: 15px; font-size: 13px; line-height: 1.5; background: #0f1015;" readonly></textarea>
            <button class="start-btn" id="copy-text-btn" style="margin-top: 0; padding: 12px; font-size: 14px;">✨ 复制到手机剪贴板</button>
        </div>

        <div class="control-bar">
            <div class="btn-group"><button class="btn-sm" id="save-btn-1">保存至 1</button><button class="btn-sm" id="save-btn-2">保存至 2</button><button class="btn-sm" id="save-btn-3">保存至 3</button></div>
            
            <div class="btn-group">
                <span style="font-size:12px; color:var(--text-muted); font-weight:bold;">🤖 AI核心:</span>
                <select id="game-model-select" class="select-sm">
                    <option value="deepseek-v4-pro">DeepSeek Pro</option>
                    <option value="deepseek-v4-flash">DeepSeek Flash</option>
                </select>
                <button class="btn-sm" id="back-menu-btn">返回主菜单</button>
            </div>
        </div>
        <div id="story-display"></div>
        <div id="input-container"><input type="text" id="player-input" placeholder="输入你的下一步行动..." autofocus><button id="send-btn">发送</button></div>
    </div>
    <script src="script.js?v=4.6"></script>
</body>
</html>
