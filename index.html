<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 文字冒险引擎 Ultra Pro</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #16171d;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-color: #e2e8f0;
            --text-muted: #64748b;
            --user-color: #ff007f;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 95vh; 
            margin: 0; 
        }

        #setup-container, #game-container { 
            width: 100%; 
            max-width: 750px; 
            background: var(--panel-bg); 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.1); 
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        h2 { margin-top: 0; color: #fff; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; color: var(--accent-color); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], textarea { width: 100%; background: #20222b; border: 1px solid #2d313f; color: #fff; padding: 14px; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; transition: all 0.3s; }
        textarea { height: 90px; resize: none; }
        input:focus, textarea:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 12px var(--accent-glow); background: #252834; }
        
        .start-btn { width: 100%; background: var(--accent-color); color: #000; border: none; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 8px; margin-top: 15px; transition: all 0.25s ease; }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); background: #26ffe6; }
        
        #game-container { display: none; padding-top: 25px; position: relative; }

        /* ======【状态栏重构：精简布局】====== */
        .status-bar { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr; 
            background: #1f212a; 
            padding: 12px 20px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border: 1px solid #2d313f;
            font-size: 13px;
            align-items: center;
        }
        .status-item { display: flex; flex-direction: column; gap: 4px; }
        .status-label { color: var(--text-muted); font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .status-value { color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 互动图标按钮样式 */
        .icon-btn {
            background: #252834;
            border: 1px solid #2d313f;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            gap: 6px;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            border-color: var(--accent-color);
            background: rgba(0, 255, 204, 0.1);
        }

        /* ======【悬浮抽屉/弹窗样式】====== */
        .info-modal {
            display: none;
            position: absolute;
            top: 105px;
            left: 35px;
            right: 35px;
            background: #1c1e27;
            border: 1px solid var(--accent-color);
            box-shadow: 0 15px 30px rgba(0,0,0,0.7), 0 0 15px var(--accent-glow);
            border-radius: 10px;
            padding: 20px;
            z-index: 100;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #2d313f;
            padding-bottom: 8px;
        }
        .modal-title { color: var(--accent-color); font-weight: bold; font-size: 15px; }
        .modal-close { color: var(--text-muted); cursor: pointer; font-size: 18px; }
        .modal-close:hover { color: #ff4757; }
        .modal-body { font-size: 14px; line-height: 1.6; color: #edf2f7; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }

        .control-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #2d313f; background: #1f212a; color: var(--text-color); border-radius: 6px; transition: all 0.2s ease; }
        .btn-sm:hover { border-color: var(--accent-color); color: var(--accent-color); background: rgba(0,255,204,0.05); }
        .btn-del { color: #ff4757; }
        .btn-del:hover { border-color: #ff4757; color: #fff; background: #ff4757; }

        /* 剧情展示区 */
        #story-display { height: 420px; overflow-y: auto; background: #0f1015; border: 1px solid #1f212a; margin-bottom: 20px; padding: 20px; border-radius: 10px; font-size: 16px; line-height: 1.8; box-sizing: border-box; }
        
        /* 输入控制区 */
        #input-container { display: flex; background: #1f212a; border-radius: 8px; padding: 6px; border: 1px solid #2d313f; }
        #input-container:focus-within { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
        #player-input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; font-size: 16px; outline: none; font-family: inherit; }
        #send-btn { background: var(--accent-color); color: #000; border: none; padding: 0 24px; font-size: 15px; font-weight: 700; cursor: pointer; border-radius: 6px; }

        /* 剧情盒子样式 */
        .story-block { 
            margin-bottom: 15px; 
            border-bottom: 1px solid #1a1c23; 
            padding-bottom: 15px; 
        }
        
        .user-action { 
            color: var(--user-color); 
            border-left: 3px solid var(--user-color); 
            padding-left: 12px; 
            font-weight: 600; 
            margin-bottom: 8px;
        }
        
        .collapsible .user-action {
            cursor: pointer;
            transition: color 0.2s;
        }
        .collapsible .user-action:hover {
            color: #ff4da6;
        }
        .collapsible .user-action::after {
            content: ' 📄 (已折叠·点击展开)';
            font-size: 11px;
            color: var(--text-muted);
            font-weight: normal;
        }
        
        .ai-response { 
            color: #edf2f7; 
            white-space: pre-wrap; 
            border-left: 3px solid var(--accent-color); 
            padding-left: 12px; 
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 2000px; 
            opacity: 1;
        }

        .collapsible.collapsed .ai-response {
            max-height: 0 !important;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin: 0;
        }
        
        .system-msg { color: var(--text-muted); font-style: italic; font-size: 13px; text-align: center; margin: 15px 0; }
    </style>
</head>
<body>

    <!-- 界面一：表单配置 -->
    <div id="setup-container">
        <h2>🛠️ 创造你的游戏世界 Ultra Pro</h2>
        <div class="form-group">
            <label>1. 你的 DeepSeek API Key</label>
            <input type="text" id="api-key-input" placeholder="sk-...">
        </div>
        <div class="form-group">
            <label>2. 快捷读档</label>
            <div style="display: flex; gap: 8px; margin-top: 5px;">
                <button class="btn-sm" onclick="quickLoad(1)">进度 1</button>
                <button class="btn-sm" onclick="quickLoad(2)">进度 2</button>
                <button class="btn-sm" onclick="quickLoad(3)">进度 3</button>
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #2d313f; margin: 25px 0;">
        <div class="form-group">
            <label>3. 设计世界观背景</label>
            <textarea id="world-input" placeholder="例如：一个充斥着霓虹光影与古老诅咒的废弃赛博地下城..."></textarea>
        </div>
        <div class="form-group">
            <label>4. 设定你的主角（名字、身份、特长）</label>
            <textarea id="character-input" placeholder="例如：雷恩，赏金猎人。右手装有高频震动短刀..."></textarea>
        </div>
        <div class="form-group">
            <label>5. 设定主线大方向</label>
            <textarea id="plot-input" placeholder="例如：找到代号为“普罗米修斯”的逃跑AI..."></textarea>
        </div>
        <button class="start-btn" id="start-game-btn">生成世界，进入冒险</button>
    </div>

    <!-- 界面二：游戏交互面板 -->
    <div id="game-container">
        <!-- 顶部独立状态栏（精简优化版） -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">📍 当前位置</span>
                <span class="status-value" id="status-loc">等待生成...</span>
            </div>
            <button class="icon-btn" id="modal-inv-btn">🎒 装备道具</button>
            <button class="icon-btn" id="modal-rel-btn">👥 人物关系</button>
        </div>

        <!-- 装备道具隐藏抽屉 -->
        <div class="info-modal" id="modal-inv">
            <div class="modal-header">
                <span class="modal-title">🎒 随身随身携带的装备与道具</span>
                <span class="modal-close" onclick="toggleModal('modal-inv', false)">✕</span>
            </div>
            <div class="modal-body" id="status-inv-box">暂无道具</div>
        </div>

        <!-- 人物关系隐藏抽屉 -->
        <div class="info-modal" id="modal-rel">
            <div class="modal-header">
                <span class="modal-title">👥 当前已知的人物关系网络</span>
                <span class="modal-close" onclick="toggleModal('modal-rel', false)">✕</span>
            </div>
            <div class="modal-body" id="status-rel-box">还未遇到重要角色，羁绊尚未建立...</div>
        </div>

        <!-- 存档控制 -->
        <div class="control-bar">
            <div class="btn-group">
                <button class="btn-sm" id="save-btn-1">保存至 1</button>
                <button class="btn-sm" id="save-btn-2">保存至 2</button>
                <button class="btn-sm" id="save-btn-3">保存至 3</button>
            </div>
            <div class="btn-group">
                <button class="btn-sm btn-del" id="del-btn-all">清空此档</button>
                <button class="btn-sm" id="back-menu-btn">返回主菜单</button>
            </div>
        </div>

        <!-- 剧情显示区 -->
        <div id="story-display"></div>

        <!-- 输入框 -->
        <div id="input-container">
            <input type="text" id="player-input" placeholder="输入你的下一步行动..." autofocus>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
